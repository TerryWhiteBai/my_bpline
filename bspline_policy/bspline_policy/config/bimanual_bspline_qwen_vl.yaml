defaults:
  - _self_
  - task: bimanual_bspline

name: bimanual_bspline_qwen_vl
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "bimanual_bspline_qwen_vl"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: bspline_policy.policy.diffusion_unet_bspline_image_policy.DiffusionUnetBSplineImagePolicy

  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: diffusion_policy.policy.qwen_vl.QwenVLVisionEncoder
    shape_meta: ${shape_meta}
    model_name: Qwen/Qwen2-VL-2B-Instruct
    dtype: torch.float16        # fp16 frozen vision backbone to save VRAM
    output_dim: 512             # per-camera feature dim, aligned with robomimic ResNet18
    freeze_backbone: True       # only train the projection layer
    input_range: [-1, 1]
    # Qwen2-VL uses dynamic resolution.  For 84x84 inputs these bounds keep
    # the vision tower fast while still preserving enough spatial detail.
    min_pixels: 3136            # 56x56
    max_pixels: 50176           # 224x224 cap; increase if you need finer features
    micro_batch_size: 8         # smaller chunks to save peak VRAM

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${horizon}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 16
  obs_as_global_cond: ${obs_as_global_cond}
  # robomimic-specific visual augmentations are not used when obs_encoder is provided
  diffusion_step_embed_dim: 128
  down_dims: [256,512,1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  bspline_degree: ${task.dataset.bspline_degree}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 601
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 50
  checkpoint_every: 100
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: bimanual_bspline_policy
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 10
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
